version: 1
status: verified-subset
data_store_profile: ../../../packs/data-stores/postgresql/profile.yaml
runner: run-recovery-drill.sh
report_validator: ../../../scripts/validate_operational_report.py
runbook: runbook.md
alerts: alerts.yaml
crash_recovery:
  shutdown_signal: SIGQUIT
  persistent_volume: named Docker volume mounted at /var/lib/postgresql
  expected_semantics: immediate shutdown followed by WAL crash recovery on the same data directory
  observed_rto_threshold_ms: 60000
migration:
  baseline: ../migrations/001_order_cancellation.sql
  forward: ../migrations/002_reconciliation_cases.sql
  rollback: ../migrations/002_reconciliation_cases.down.sql
  runner: ../app/src/migrate.ts#migrate
  rollback_runner: ../app/src/rollback.ts#rollbackMigration
  rollback_boundary: rollback is rejected after reconciliation_cases contains rows; use roll-forward repair instead
logical_backup:
  format: custom
  command: pg_dump --format=custom --no-owner --no-privileges
  restore_command: pg_restore --no-owner --no-privileges --exit-on-error
  independent_restore_volume: true
  observed_rto_threshold_ms: 120000
reconciliation:
  table: reconciliation_cases
  service: ../app/src/reconciliation.ts#PostgresReconciliationService
  operator_command: ../app/src/ops-main.ts#resolve-reconciliation
  unknown_outcome_policy: keep cancellation pending and order protected until an operator records authoritative provider status
observability:
  health_view: operational_recovery_health
  alert_catalog: alerts.yaml
  required_signals:
    - pending cancellations
    - ready outbox events
    - expired worker leases
    - open reconciliation cases
    - oldest pending age
scenarios:
  - id: immediate-shutdown-restart
    expectation: A committed pending cancellation, outbox row, and audit row survive SIGQUIT and are processed after the same PostgreSQL data volume restarts.
    evidence: run-recovery-drill.sh#docker kill --signal=SIGQUIT
  - id: retained-data-forward-migration
    expectation: Migration 002 applies over a populated 001 database without changing existing order, cancellation, outbox, or audit counts.
    evidence: run-recovery-drill.sh#snapshot-after-forward-migration.json
  - id: guarded-migration-rollback
    expectation: Migration 002 can roll back on an isolated pre-002 restore before reconciliation data exists, while the down migration rejects destructive rollback after that boundary.
    evidence: ../migrations/002_reconciliation_cases.down.sql#cannot be rolled back after reconciliation data exists
  - id: logical-backup-independent-restore
    expectation: A custom-format logical backup restores into a separate PostgreSQL volume with matching business, migration, and reconciliation counts.
    evidence: run-recovery-drill.sh#pg_restore
  - id: reconciliation-resolution
    expectation: An unknown provider outcome opens an operator-visible case and an authoritative completed resolution atomically finalizes cancellation, order, outbox, case, and audit state.
    evidence: ../app/test/operational.test.ts#completed reconciliation resolves cancellation, order, outbox, and audit atomically
  - id: operational-health
    expectation: Health evidence exposes pending work, ready outbox work, expired leases, open reconciliation cases, and oldest pending age.
    evidence: ../app/test/operational.test.ts#unknown provider outcome opens an observable reconciliation case
limitations:
  - The drill restarts a single PostgreSQL container and persistent volume; host loss, storage corruption, replication, and failover are not exercised.
  - Logical backup and restore are verified, but continuous WAL archiving and point-in-time recovery are not configured.
  - Observed recovery times are CI measurements, not production SLO commitments.
  - Provider status remains simulated; no external payment-provider status API is exercised.
  - The operator path is a CLI and service contract, not a production authenticated administration surface.
sources:
  - https://www.postgresql.org/docs/current/server-shutdown.html
  - https://www.postgresql.org/docs/current/app-pgdump.html
  - https://www.postgresql.org/docs/current/app-pgrestore.html
  - https://www.postgresql.org/docs/current/continuous-archiving.html
