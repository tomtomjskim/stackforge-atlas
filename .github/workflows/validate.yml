name: Validate Atlas

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate structured artifacts
        run: |
          python scripts/validate_atlas.py
          python scripts/validate_pilots.py

  node-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilots/order-cancellation-node/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install exact pilot dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check and test runnable pilot
        run: npm run check
