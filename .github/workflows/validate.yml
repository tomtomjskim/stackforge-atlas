name: Validate Atlas

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate structured artifacts
        run: |
          python scripts/validate_atlas.py
          python scripts/validate_pilots.py
          python scripts/validate_durability_pilots.py
      - name: Reject known metadata regressions
        run: |
          python scripts/test_validate_pilot_regressions.py
          python scripts/test_validate_durability_regressions.py

  node-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilots/order-cancellation-node/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pilots/order-cancellation-node/app/package-lock.json
      - name: Install locked pilot dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and test runnable pilot
        run: npm run check

  postgres-pilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: stackforge
          POSTGRES_USER: stackforge
          POSTGRES_PASSWORD: stackforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackforge -d stackforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://stackforge:stackforge@127.0.0.1:5432/stackforge
    defaults:
      run:
        working-directory: pilots/order-cancellation-postgres/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pilot dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply migrations
        run: npm run migrate
      - name: Type-check and test PostgreSQL durability pilot
        run: npm run check
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: order-cancellation-postgres-lockfile
          path: pilots/order-cancellation-postgres/app/package-lock.json
          retention-days: 1
